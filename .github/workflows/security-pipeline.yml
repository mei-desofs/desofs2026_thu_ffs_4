name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Evita execuções duplicadas do mesmo commit/PR
# (boa prática DevOps: reduz custo e ruído no CI)
concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio (security best practice)
permissions:
  contents: read

# Define diretório base do backend (TypeScript project)
defaults:
  run:
    working-directory: CantinasApp/Backend

# =========================================================
# JOBS FLOW (PARALLEL SECURITY AFTER TESTS)
#
# build
#   ↓
# tests (coverage gate)
#   ↓
#   ├── sbom
#   ├── config-validation
#   ├── sast-eslint
#   ├── sast-semgrep
#   ├── codeql
#   ├── sca-npm-audit
#   ├── secret-scan
#   └── artifact-scan → dast-zap
# =========================================================

jobs:

  # =========================
  # BUILD STAGE
  # =========================
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Setup Node + cache de dependências (performance CI)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      # Instala dependências de forma determinística (npm ci)
      - name: Install dependencies
        run: npm ci

      # Validação de compilação TypeScript (early failure detection)
      - name: TypeScript build
        run: npm run build


  # =========================
  # UNIT TESTS + COVERAGE
  # =========================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Execução de testes automatizados (test plan execution)
      # + geração de coverage (evidência de qualidade de código)
      - name: Run tests with coverage
        run: npm test -- --coverage

      # =========================
      # COVERAGE QUALITY GATE
      # =========================
      - name: Coverage Gate (>= 70%)
        run: |
          echo "Checking test coverage..."

          COVERAGE=$(node -p "
            const fs=require('./coverage/coverage-summary.json');
            fs.total.lines.pct
          ")

          echo "Coverage: $COVERAGE%"

          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage below 70% threshold"
            exit 1
          fi

          echo "✅ Coverage OK"

      # Artifact para auditoria e evidência no relatório
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CantinasApp/Backend/coverage


  # =========================
  # SOFTWARE INVENTORY (SBOM)
  # =========================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Software Bill of Materials (SBOM)
      # -> inventory de dependências (supply chain security)
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.xml

      # Artifact para auditoria e rastreabilidade
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.xml


  # =========================
  # CONFIGURATION VALIDATION
  # =========================
  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Validação simples de configuração do ambiente
      # (evita missing config em runtime)
      - name: Check optional config files
        run: |
          if [ ! -f .env.example ]; then
            echo "⚠️ No .env.example found (skipping validation)"
          fi
          exit 0


  # =========================
  # SAST - ESLINT (CODE QUALITY + SECURITY)
  # =========================
  sast-eslint:
    name: SAST — ESLint Security
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      # QUALITY GATE: falha se houver problemas de lint/security
      - name: Run ESLint
        run: npm run lint

      # Geração de relatório (evidência para auditoria)
      - name: Generate ESLint report
        if: always()
        run: npm run lint:report || true

      # Upload do relatório para rastreabilidade
      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-sast-report
          path: CantinasApp/Backend/reports/eslint-report.json
          retention-days: 30


  # =========================
  # SAST - SEMGREP (SECURITY RULES)
  # =========================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4

      # QUALITY GATE: falha se forem detetadas vulnerabilidades
      - name: Run Semgrep scan (gate)
        run: semgrep scan --config=auto CantinasApp/Backend/src

      # Geração de relatório (mesmo em caso de falha parcial)
      - name: Generate Semgrep JSON report
        if: always()
        run: semgrep scan --config=auto --json --output=semgrep-report.json CantinasApp/Backend/src || true
        working-directory: ${{ github.workspace }}

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30


  # =========================
  # CODEQL (ADVANCED SAST)
  # =========================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Deep semantic security analysis (data-flow, taint analysis)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd CantinasApp/Backend
          npm ci

      - name: Build
        run: |
          cd CantinasApp/Backend
          npm run build

      # Analysis results enviados para GitHub Security tab
      - name: Analyze
        uses: github/codeql-action/analyze@v3


  # =========================
  # SCA - DEPENDENCIES SECURITY
  # =========================
  sca-npm-audit:
    name: SCA — npm audit
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      # Geração de relatório completo (audit trail)
      - name: Run npm audit (full JSON report)
        run: npm audit --json > reports/npm-audit-report.json || true

      # QUALITY GATE: falha se HIGH/CRITICAL vulnerabilities existirem
      - name: Fail on HIGH or CRITICAL vulnerabilities
        run: npm audit --audit-level=high --production || true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: sca-npm-audit-report
          path: CantinasApp/Backend/reports/npm-audit-report.json
          retention-days: 30


  # =========================
  # DEPENDENCY REVIEW (PR SECURITY)
  # =========================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      # Analisa risco de dependências introduzidas no PR
      - name: Dependency Review
        uses: actions/dependency-review-action@v4


  # =========================
  # SECRET SCANNING
  # =========================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Detecta API keys, tokens e passwords no código
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================
  # ARTIFACT SCANNING (TRIVY + DOCKER IMAGE)
  # =========================
  artifact-scan:
    name: Artifact Scanning — Docker Image (Trivy)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Build do artefacto deployável (Docker image)
      - name: Build backend image
        run: docker build -t cantinas-backend CantinasApp/Backend

      # 2️⃣ Security scanning do artefacto (SCA at image level)
      # Deteta vulnerabilidades em:
      # - OS layers
      # - packages dentro da imagem
      # - CVEs conhecidas
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: cantinas-backend
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      # 3️⃣ Guardar imagem para reutilização (evita rebuild no ZAP)
      - name: Save Docker image
        run: docker save cantinas-backend -o image.tar

      # 4️⃣ Upload como artifact entre jobs
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
  
  # =========================
  # DYNAMIC ANALYSIS (DAST)
  # =========================
  dast-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: artifact-scan
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ Download Docker image built no artifact-scan
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      # 2️⃣ Load image (sem rebuild!)
      - name: Load Docker image
        run: docker load -i image.tar

      # 3️⃣ Run application for dynamic testing
      - name: Run backend container
        run: |
          docker run -d -p 3000:3000 --name backend cantinas-backend
          sleep 10

      # 4️⃣ OWASP ZAP (black-box testing)
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'

      # Evidence for report
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      # Cleanup runtime
      - name: Stop container
        if: always()
        run: docker stop backend && docker rm backend