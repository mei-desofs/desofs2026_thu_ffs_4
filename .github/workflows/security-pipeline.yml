name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Evita execuções duplicadas do mesmo commit/PR
concurrency:
  group: security-pipeline-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio
permissions:
  contents: read

# Diretório base do backend
defaults:
  run:
    working-directory: CantinasApp/Backend

# =========================================================
# JOBS FLOW
#
# build
#   ├── tests
#   ├── config-validation
#   ├── dependency-review
#   └── secret-scan
#
# tests
#   ├── sbom
#   ├── sast-eslint
#   ├── sast-semgrep
#   ├── codeql
#   ├── sca-npm-audit
#   └── artifact-scan → dast-zap
# =========================================================

jobs:
  # =========================================================
  # BUILD
  # =========================================================
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      # Instalação determinística
      - name: Install dependencies
        run: npm ci

      # Early failure detection
      - name: TypeScript build
        run: npm run build

  # =========================================================
  # UNIT TESTS + COVERAGE
  # =========================================================
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Test execution + coverage evidence
      - name: Run tests with coverage
        run: npm test -- --coverage

      # =========================================================
      # COVERAGE QUALITY GATE
      # =========================================================
      - name: Coverage Gate (>= 70%)
        run: |
          echo "Checking coverage threshold..."

          COVERAGE=$(node -p "
            const fs=require('./coverage/coverage-summary.json');
            fs.total.lines.pct
          ")

          echo "Coverage: $COVERAGE%"

          node -e "
            const coverage=parseFloat(process.argv[1]);

            if (coverage < 70) {
              console.error('❌ Coverage below 70%');
              process.exit(1);
            }

            console.log('✅ Coverage OK');
          " "$COVERAGE"

      # Evidence artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CantinasApp/Backend/coverage
          retention-days: 30

  # =========================================================
  # CONFIG VALIDATION
  # =========================================================
  config-validation:
    name: Config Validation
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate configuration files
        run: |
          if [ ! -f .env.example ]; then
            echo "⚠️ No .env.example found"
          else
            echo "✅ .env.example exists"
          fi

  # =========================================================
  # DEPENDENCY REVIEW (PR SECURITY)
  # =========================================================
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detects risky dependencies introduced in PRs
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  # =========================================================
  # SECRET SCANNING
  # =========================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect API keys, tokens and secrets
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # SBOM GENERATION
  # =========================================================
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Software Bill of Materials
      - name: Generate SBOM (CycloneDX)
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: CantinasApp/Backend/sbom.xml
          retention-days: 30

  # =========================================================
  # SAST — ESLINT
  # =========================================================
  sast-eslint:
    name: SAST — ESLint Security
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      # QUALITY GATE
      - name: Run ESLint
        run: npm run lint

      # Evidence generation
      - name: Generate ESLint report
        if: always()
        run: npm run lint:report || true

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-sast-report
          path: CantinasApp/Backend/reports/eslint-report.json
          retention-days: 30

  # =========================================================
  # SAST — SEMGREP
  # =========================================================
  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QUALITY GATE
      - name: Run Semgrep scan
        run: semgrep scan --config=auto src

      # Evidence generation
      - name: Generate Semgrep JSON report
        if: always()
        run: semgrep scan --config=auto --json --output=semgrep-report.json src || true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30

  # =========================================================
  # CODEQL
  # =========================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deep semantic analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Uploads results to GitHub Security tab
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  # =========================================================
  # SCA — npm audit
  # =========================================================
  sca-npm-audit:
    name: SCA — npm audit
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      # Full JSON report for evidence
      - name: Generate npm audit report
        run: npm audit --json > reports/npm-audit-report.json || true

      # QUALITY GATE
      - name: Fail on HIGH or CRITICAL vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: sca-npm-audit-report
          path: CantinasApp/Backend/reports/npm-audit-report.json
          retention-days: 30

  # =========================================================
  # ARTIFACT SCANNING — TRIVY
  # =========================================================
  artifact-scan:
    name: Artifact Scanning — Docker Image (Trivy)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build deployable artifact
      - name: Build backend image
        run: docker build -t cantinas-backend .

      # Image vulnerability scanning
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cantinas-backend
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Save image for reuse in DAST stage
      - name: Save Docker image
        run: docker save cantinas-backend -o image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: CantinasApp/Backend/image.tar
          retention-days: 1

  # =========================================================
  # DAST — OWASP ZAP
  # =========================================================
  dast-zap:
    name: DAST — OWASP ZAP
    runs-on: ubuntu-latest
    needs: artifact-scan
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download built image
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: CantinasApp/Backend

      # Load image
      - name: Load Docker image
        run: docker load -i image.tar

      # Start application
      - name: Run backend container
        run: |
          docker run -d -p 3000:3000 --name backend cantinas-backend

          echo "Waiting for application startup..."
          sleep 15

          docker ps
          docker logs backend || true

      # Dynamic security testing
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          fail_action: true

      # Evidence artifact
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      # Cleanup
      - name: Stop container
        if: always()
        run: |
          docker stop backend || true
          docker rm backend || true
