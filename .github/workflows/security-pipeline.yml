name: Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: CantinasApp/Backend

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

  sast-eslint:
    name: SAST — ESLint Security
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run ESLint (SAST)
        run: npm run lint:report || true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-sast-report
          path: CantinasApp/Backend/reports/eslint-report.json
          retention-days: 30

  sca-npm-audit:
    name: SCA — npm audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: CantinasApp/Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run npm audit (full JSON report)
        run: npm audit --json > reports/npm-audit-report.json || true

      - name: Fail on HIGH or CRITICAL vulnerabilities
        run: npm audit --audit-level=high --production

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-npm-audit-report
          path: CantinasApp/Backend/reports/npm-audit-report.json
          retention-days: 30

  sast-semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    needs: build
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep scan
        run: semgrep scan --config=auto --json --output=semgrep-report.json CantinasApp/Backend/src || true
        working-directory: ${{ github.workspace }}

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep-report.json
          retention-days: 30
